spring:
  application:
    name: ikibaho

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/ikibaho
    username: ikibaho
    password: ikibaho

  docker:
    compose:
      lifecycle-management: start_and_stop

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

ikibaho:
  security:
    jwt:
      issuer: https://ikibaho.local
      public-key: file:keys/app.pub
      private-key: file:keys/app.key
      access-token-ttl: 15m
      refresh-token-ttl: 30d

    google:
      # Blank disables Google sign-in. There is deliberately no default: an empty
      # audience check would accept ID tokens minted for any Google application.
      client-id: ${GOOGLE_CLIENT_ID:}
      allow-auto-link: true

    refresh-cookie:
      name: ikibaho_refresh
      # Narrow path: the browser attaches this only to /api/v1/auth/*,
      # never to ordinary API calls.
      path: /api/v1/auth
      same-site: Strict
      # MUST be true in production. False here only because local dev is plain http,
      # and a Secure cookie is never sent over http -- including to localhost.
      secure: false

    cors:
      # Explicit origins only: allowCredentials forbids "*". Empty list = CORS off.
      # Any origin listed here can drive the API using the user's refresh cookie.
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000

  storage:
    bucket: ikibaho-attachments
    region: us-east-1
    # MinIO locally; leave blank for real S3.
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    # MinIO serves buckets as a path segment; S3 proper prefers virtual-host style.
    path-style-access: true
    upload-url-ttl: PT15M
    download-url-ttl: PT5M
    # 25 Mib. Enforced before a URL is issued, since a presigned PUT connot cap size.
    max-upload-bytes: 26214400
    abandon-uploads-after: PT2H
    sweep-cron: "0 15 * * * *"

  webhooks:
    poll-interval: 10000
    batch-size: 50
    timeout: PT10S
    # Delivering to loopback or RFC1918 addresses turns this server into nan
    # internal-network probe. On only for local development.
    allow-private-addresses: false

  notifications:
    email:
      enabled: false
      from: no-reply@ikibaho.local
    digest-cron: "0 0 8 * * *"
    digest-lookback: PT24H
    sse-heartbeat: 25000
    sse-timeout: 1800000

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        # 'modulith' publishes the module structure; the event publication
        # registry is what actually needs watching. Publications that never
        # complete mean a listener is failing every retry, and they accumulate
        # in a table on the write path of every domain change.
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: always
